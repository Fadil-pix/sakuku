<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#191A23" />
    <title>Sakuku</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link rel="icon" type="image/png" href="icon-512.png" />
    <script src="config.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #191a23;
        --lime: #b9ff66;
        --g: #f3f3f3;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        font:
          500 15px "Space Grotesk",
          system-ui,
          sans-serif;
        color: var(--ink);
        background: #fff;
      }
      #app {
        max-width: 480px;
        margin: auto;
        padding: 16px 16px 120px;
      }
      .pg {
        animation: fd 0.15s;
      }
      @keyframes fd {
        from {
          opacity: 0;
        }
      }
      .card {
        border: 2px solid var(--ink);
        border-radius: 22px;
        box-shadow: 0 5px 0 var(--ink);
        padding: 16px;
        margin: 16px 0;
        background: #fff;
      }
      .card.k {
        background: var(--ink);
        color: #fff;
      }
      .card.g {
        background: var(--g);
      }
      .card p {
        margin-top: 10px;
      }
      .hl {
        background: var(--lime);
        color: var(--ink);
        border-radius: 6px;
        padding: 2px 8px;
        font-weight: 700;
        font-size: 19px;
        display: inline-block;
      }
      .btn {
        border: 2px solid var(--ink);
        border-radius: 999px;
        background: var(--lime);
        color: var(--ink);
        padding: 12px 18px;
        font-family: inherit;
        font-size: 15px;
        font-weight: 700;
        box-shadow: 0 4px 0 var(--ink);
        cursor: pointer;
      }
      .btn:active {
        transform: translateY(4px);
        box-shadow: 0 0 0 var(--ink);
      }
      .btn.k {
        background: var(--ink);
        color: var(--lime);
      }
      .btn:disabled {
        opacity: 0.6;
      }
      .big {
        display: block;
        width: 100%;
        margin: 12px 0;
        text-align: center;
      }
      .chip {
        border: 2px solid var(--ink);
        border-radius: 999px;
        padding: 6px 12px;
        background: #fff;
        font-family: inherit;
        font-size: 14px;
        font-weight: 700;
        white-space: nowrap;
        color: var(--ink);
      }
      .chip.on {
        background: var(--lime);
      }
      .row {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding: 6px 2px 8px;
        margin: 6px 0;
      }
      .row::-webkit-scrollbar {
        display: none;
      }
      .wrap {
        flex-wrap: wrap;
      }
      .row2 {
        display: flex;
        gap: 8px;
        margin: 8px 0;
      }
      input,
      select {
        border: 2px solid var(--ink);
        border-radius: 14px;
        padding: 11px 12px;
        font-family: inherit;
        font-size: 15px;
        width: 100%;
        background: #fff;
        color: var(--ink);
        margin-top: 8px;
      }
      .hd {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .x {
        border: 2px solid var(--ink);
        background: #fff;
        border-radius: 50%;
        width: 36px;
        height: 36px;
        font-weight: 700;
        color: var(--ink);
      }
      nav {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        display: flex;
        justify-content: space-around;
        align-items: center;
        background: #fff;
        border-top: 2px solid var(--ink);
        padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
        z-index: 5;
      }
      nav button {
        background: none;
        border: 0;
        font-family: inherit;
        font-size: 11px;
        font-weight: 700;
        color: #888;
        display: grid;
        gap: 2px;
        justify-items: center;
        width: 20%;
      }
      nav button.on {
        color: var(--ink);
      }
      nav b {
        font-size: 20px;
        font-weight: 400;
      }
      nav .plus {
        width: 62px;
        height: 62px;
        border-radius: 50%;
        background: var(--lime);
        border: 2px solid var(--ink);
        box-shadow: 0 4px 0 var(--ink);
        font-size: 32px;
        color: var(--ink);
        margin-top: -30px;
        display: block;
      }
      nav .plus:active {
        transform: translateY(4px);
        box-shadow: none;
      }
      #sheet {
        position: fixed;
        inset: 0;
        background: #191a23b3;
        display: none;
        z-index: 10;
        align-items: flex-end;
      }
      #sheet.open {
        display: flex;
        animation: fd 0.2s;
      }
      .pn {
        background: #fff;
        width: 100%;
        max-width: 480px;
        margin: auto auto 0;
        border: 2px solid var(--ink);
        border-radius: 24px 24px 0 0;
        padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
        max-height: 92vh;
        overflow: auto;
      }
      .amt {
        font-size: 34px;
        font-weight: 700;
        text-align: center;
        margin: 10px 0;
      }
      .pad {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin: 8px 0;
      }
      .pad button {
        border: 2px solid var(--ink);
        border-radius: 14px;
        background: var(--g);
        padding: 12px;
        font-family: inherit;
        font-size: 20px;
        font-weight: 700;
        color: var(--ink);
      }
      .pad button:active {
        background: var(--lime);
      }
      .tx {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: center;
        padding: 10px 0;
        border-bottom: 2px dashed #ccc;
      }
      .tx:last-child {
        border: 0;
      }
      .pill {
        background: var(--lime);
        border: 2px solid var(--ink);
        border-radius: 8px;
        padding: 0 6px;
        font-size: 12px;
        font-weight: 700;
      }
      .in {
        color: #0a7a2f;
      }
      .pv {
        min-height: 20px;
        font-size: 13px;
        margin: 8px 2px 0;
        color: #555;
      }
      #toast {
        position: fixed;
        top: 14px;
        left: 50%;
        transform: translate(-50%, -90px);
        background: var(--ink);
        color: var(--lime);
        border: 2px solid var(--lime);
        border-radius: 999px;
        padding: 10px 18px;
        z-index: 20;
        transition: 0.25s;
        max-width: 92vw;
        font-weight: 700;
        text-align: center;
      }
      #toast.show {
        transform: translate(-50%, 0);
      }
      #toast.bad {
        background: #ff4d4d;
        color: #fff;
        border-color: var(--ink);
      }
      .sk {
        height: 90px;
        border-radius: 22px;
        border: 2px solid var(--ink);
        background: linear-gradient(90deg, #eee, #fafafa, #eee);
        background-size: 200%;
        animation: sh 1.2s infinite;
        margin: 16px 0;
      }
      @keyframes sh {
        to {
          background-position: -200%;
        }
      }
      .donut {
        width: 150px;
        height: 150px;
        border-radius: 50%;
        margin: 10px auto;
        border: 2px solid var(--ink);
        position: relative;
      }
      .donut:after {
        content: "";
        position: absolute;
        inset: 34px;
        background: #fff;
        border-radius: 50%;
        border: 2px solid var(--ink);
      }
      .bars {
        display: flex;
        gap: 6px;
        height: 140px;
        overflow-x: auto;
        margin-top: 10px;
      }
      .bc {
        flex: none;
        width: 26px;
        display: flex;
        flex-direction: column;
        align-items: center;
        height: 100%;
        font-size: 10px;
      }
      .bb {
        display: flex;
        align-items: flex-end;
        gap: 2px;
        flex: 1;
        width: 100%;
      }
      .bb i {
        flex: 1;
        border: 1.5px solid var(--ink);
        border-radius: 4px 4px 0 0;
        display: block;
        min-height: 2px;
      }
      .cmp {
        height: 22px;
        border: 2px solid var(--ink);
        border-radius: 8px;
        margin: 4px 0 10px;
      }
      .empty {
        text-align: center;
        padding: 20px 8px;
      }
      .back {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 4px;
      }
      .menu {
        display: flex;
        align-items: center;
        gap: 14px;
        width: 100%;
        text-align: left;
        font-family: inherit;
        font-size: 15px;
        color: var(--ink);
        cursor: pointer;
      }
      .menu:active {
        transform: translateY(4px);
        box-shadow: 0 1px 0 var(--ink);
      }
      .menu .ic {
        width: 54px;
        height: 54px;
        flex: none;
        border: 2px solid var(--ink);
        border-radius: 16px;
        background: var(--lime);
        display: grid;
        place-items: center;
        font-size: 28px;
      }
      .menu small {
        display: block;
        color: #555;
        font-weight: 500;
      }
      .gh {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .gi {
        width: 50px;
        height: 50px;
        flex: none;
        border: 2px solid var(--ink);
        border-radius: 16px;
        display: grid;
        place-items: center;
        font-size: 26px;
        font-family: inherit;
        cursor: pointer;
      }
      .gi.sel {
        outline: 3px solid var(--ink);
        outline-offset: 2px;
      }
      .bar {
        height: 30px;
        border: 3px solid var(--ink);
        border-radius: 999px;
        background: #fff;
        overflow: hidden;
        position: relative;
        margin: 12px 0 8px;
      }
      .bar i {
        display: block;
        height: 100%;
        border-right: 3px solid var(--ink);
        transition: width 0.5s;
      }
      .bar i.z {
        border-right: 0;
      }
      .bar span {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font-weight: 700;
        font-size: 13px;
      }
      .st {
        display: inline-block;
        border: 2px solid var(--ink);
        border-radius: 8px;
        padding: 0 6px;
        font-size: 12px;
        font-weight: 700;
        background: var(--lime);
      }
      .st.w {
        background: #ffcf56;
      }
      .st.gr {
        background: #eee;
      }
      .warn {
        background: #fff6d6;
        border: 2px dashed var(--ink);
        border-radius: 12px;
        padding: 6px 10px;
        font-size: 13px;
        margin-top: 10px;
        font-weight: 700;
      }
      .sm {
        padding: 8px 12px;
        font-size: 13px;
        box-shadow: 0 3px 0 var(--ink);
      }
      .chip {
        touch-action: manipulation;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      .steps {
        display: flex;
        gap: 6px;
        margin: 10px 0;
      }
      .steps i {
        flex: 1;
        height: 10px;
        border: 2px solid var(--ink);
        border-radius: 6px;
        background: #fff;
      }
      .steps i.on {
        background: var(--lime);
      }
      .steps i.cur {
        background: var(--ink);
      }
      .lab {
        font-size: 13px;
        font-weight: 700;
        margin-top: 10px;
        display: block;
      }
      .chk {
        display: flex;
        gap: 10px;
        align-items: center;
        margin-top: 12px;
        font-weight: 700;
      }
      .chk input {
        width: 22px;
        height: 22px;
        margin: 0;
        accent-color: #191a23;
        flex: none;
      }
      .conf {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
        z-index: 30;
      }
      .conf i {
        position: absolute;
        top: 45%;
        width: 12px;
        height: 12px;
        border: 2px solid var(--ink);
        animation: cf 1.4s ease-out forwards;
      }
      @keyframes cf {
        to {
          transform: translate(var(--dx), var(--dy)) rotate(var(--r));
          opacity: 0;
        }
      }
      .pop {
        animation: pp 0.6s;
      }
      @keyframes pp {
        40% {
          transform: scale(1.04);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="sheet"></div>
    <div id="toast"></div>
    <script>
      const CATS = {
        out: [
          "Makanan",
          "Minuman",
          "Transport",
          "Belanja",
          "Tagihan",
          "Hiburan",
          "Kesehatan",
          "Tabungan",
          "Lainnya",
        ],
        in: ["Gaji", "Bonus", "Usaha", "Tabungan", "Lainnya"],
      };
      const KW = {
        Minuman: "kopi kenangan janji jiwa teh es boba jus minum",
        Makanan: "makan nasi ayam bakso mie soto sate roti snack warteg resto",
        Transport: "bensin parkir tol grab gojek ojek bus krl kereta",
        Belanja: "belanja indomaret alfamart supermarket shopee tokopedia",
        Tagihan: "listrik pulsa internet wifi air tagihan token cicilan kos",
        Hiburan: "nonton bioskop netflix spotify game",
        Kesehatan: "obat apotek dokter klinik",
        Gaji: "gaji salary",
        Bonus: "bonus thr",
        Usaha: "jual untung usaha",
      };
      const IN_KW = "gaji bonus thr terima masuk untung jual salary".split(" ");
      const COL = [
        "#B9FF66",
        "#191A23",
        "#9aa0a6",
        "#7bd389",
        "#ffcf56",
        "#ff8a65",
        "#8ecae6",
        "#c3b1ff",
      ];
      const MODEL = "gemini-flash-latest"; // jika scan error "model not found", ganti ke 'gemini-2.5-flash'
      const EMPTY =
        '<div class="empty"><svg width="90" height="90" viewBox="0 0 90 90"><circle cx="45" cy="45" r="36" fill="#B9FF66" stroke="#191A23" stroke-width="3"/><rect x="26" y="32" width="38" height="28" rx="6" fill="#fff" stroke="#191A23" stroke-width="3"/><path d="M26 42h38" stroke="#191A23" stroke-width="3"/></svg><p>Belum ada transaksi di sini.<br>Ketuk + untuk mencatat.</p></div>';
      const $ = (s) => document.querySelector(s),
        esc = (s) =>
          String(s).replace(
            /[&<>"]/g,
            (c) =>
              ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
          );
      const rp = (n) => "Rp " + Math.round(n).toLocaleString("id-ID");
      const iso = (d) =>
        d.getFullYear() +
        "-" +
        String(d.getMonth() + 1).padStart(2, "0") +
        "-" +
        String(d.getDate()).padStart(2, "0");
      const today = () => iso(new Date());
      const addDays = (s, n) => {
        const d = new Date(s + "T00:00");
        d.setDate(d.getDate() + n);
        return iso(d);
      };
      const days = (f, t) =>
        Math.round((new Date(t + "T00:00") - new Date(f + "T00:00")) / 864e5) +
        1;
      const inR = (x, f, t) => x.date >= f && x.date <= t;
      const tot = (a, ty) =>
        a.filter((x) => x.type === ty).reduce((s, x) => s + x.amt, 0);
      const S = {
        user: undefined,
        ready: 0,
        tx: [],
        tab: "home",
        per: "month",
        q: "",
        cat: "",
        hf: "",
        ht: "",
        presets: JSON.parse(localStorage.presets || "null") || [
          "Parkir 2rb",
          "Bensin 30rb",
          "Makan siang 25rb",
          "Kopi 20rb",
          "Tol 15rb",
        ],
      };
      const n0 = new Date();
      S.from = iso(new Date(n0.getFullYear(), n0.getMonth(), 1));
      S.to = today();
      let F = null;

      function toast(m, bad, ms = 2600) {
        const t = $("#toast");
        t.textContent = m;
        t.className = "show" + (bad ? " bad" : "");
        clearTimeout(toast.t);
        toast.t = setTimeout(() => (t.className = ""), ms);
      }

      // ---- Callback dari Firebase (didefinisikan di script module di bawah) ----
      function onUser(u) {
        S.user = u || null;
        if (!u) {
          S.tx = [];
          S.ready = 0;
          S.goals = [];
          S.gReady = 0;
          S.splits = [];
          S.spReady = 0;
          SB = null;
        }
        render();
      }
      function onTx(a) {
        S.tx = a;
        S.ready = 1;
        softR();
      }
      function onPrefs(p) {
        if (Array.isArray(p)) {
          S.presets = p;
          localStorage.presets = JSON.stringify(p);
          render();
        }
      }
      function onErr(e) {
        toast("Gagal memuat data: " + e.message, 1);
      }
      function onNoConfig() {
        S.noCfg = 1;
        render();
      }
      function signIn() {
        FB.signIn().catch((e) => toast("Gagal masuk: " + e.message, 1));
      }
      function logout() {
        if (confirm("Keluar dari akun?")) {
          FB.out();
          S.tab = "home";
          S.sub = "menu";
        }
      }

      function save(t) {
        if (!(t.amt > 0))
          return (toast("Nominal harus lebih dari 0", 1), false);
        if (!t.date) return (toast("Tanggal wajib diisi", 1), false);
        const d = {
          type: t.type,
          amt: t.amt,
          cat: t.cat,
          note: t.note || "",
          date: t.date,
          ts: t.ts || Date.now(),
        };
        (t.id ? FB.set(t.id, d) : FB.add(d)).catch((e) =>
          toast("Gagal menyimpan: " + e.message, 1),
        );
        toast(
          navigator.onLine
            ? "✓ Tersimpan: " + rp(t.amt) + " · " + t.cat
            : "✓ Tersimpan di HP, disinkronkan saat online",
        );
        return true;
      }

      // ---- Smart Text Bar ----
      function parse(s) {
        s = s.trim();
        const re = /(\d[\d.,]*)\s*(rb|ribu|k|jt|juta)?(?![a-z])/gi;
        let m,
          all = [];
        while ((m = re.exec(s))) all.push(m);
        if (!all.length) return null;
        const m1 = [...all].reverse().find((x) => x[2]) || all[all.length - 1],
          u = (m1[2] || "").toLowerCase();
        let v;
        if (u) {
          v =
            parseFloat(m1[1].replace(",", ".")) *
            (u === "jt" || u === "juta" ? 1e6 : 1e3);
        } else v = parseInt(m1[1].replace(/[.,]/g, ""), 10);
        if (!(v > 0)) return null;
        let note = (
          s.slice(0, m1.index) +
          " " +
          s.slice(m1.index + m1[0].length)
        )
          .replace(/\s+/g, " ")
          .trim();
        const low = s.toLowerCase(),
          type = IN_KW.some((w) => low.includes(w)) ? "in" : "out";
        let cat = "Lainnya";
        for (const c in KW)
          if (
            CATS[type].includes(c) &&
            KW[c].split(" ").some((w) => low.includes(w))
          ) {
            cat = c;
            break;
          }
        note = note ? note[0].toUpperCase() + note.slice(1) : cat;
        return { type, amt: Math.round(v), cat, note, date: today() };
      }
      function pv(v) {
        const p = parse(v);
        $("#pv").textContent = p
          ? (p.type === "in" ? "Pemasukan" : "Pengeluaran") +
            " · " +
            p.cat +
            " · " +
            rp(p.amt) +
            " · " +
            p.note
          : "";
      }
      function quick(s) {
        const p = parse(s);
        if (!p)
          return (toast("Nominal tidak terbaca. Contoh: Kopi 22rb", 1), false);
        return save(p);
      }
      function qs() {
        if (quick($("#sb").value)) {
          $("#sb").value = "";
          pv("");
        }
      }

      // ---- Periode ----
      function range() {
        const n = new Date(),
          t = today();
        if (S.per === "day") return [t, t];
        if (S.per === "week") {
          const d = new Date(n);
          d.setDate(n.getDate() - ((n.getDay() + 6) % 7));
          return [iso(d), t];
        }
        if (S.per === "month")
          return [iso(new Date(n.getFullYear(), n.getMonth(), 1)), t];
        return [S.from || t, S.to || t];
      }
      function prevRange(f, t) {
        const L = days(f, t);
        if (S.per === "month") {
          const d = new Date(f + "T00:00");
          d.setMonth(d.getMonth() - 1);
          const pf = iso(d);
          return [pf, addDays(pf, L - 1)];
        }
        const pf = addDays(f, S.per === "week" ? -7 : -L);
        return [pf, addDays(pf, L - 1)];
      }
      function perBar() {
        return (
          '<div class="row">' +
          [
            ["day", "Hari Ini"],
            ["week", "Minggu Ini"],
            ["month", "Bulan Ini"],
            ["custom", "Custom"],
          ]
            .map(
              ([k, l]) =>
                `<button class="chip ${S.per === k ? "on" : ""}" onclick="S.per='${k}';render()">${l}</button>`,
            )
            .join("") +
          "</div>" +
          (S.per === "custom"
            ? `<div class="row2"><input type="date" value="${S.from}" onchange="S.from=this.value;render()"><input type="date" value="${S.to}" onchange="S.to=this.value;render()"></div>`
            : "")
        );
      }

      // ---- Halaman ----

      function pAmt(s) {
        s = String(s == null ? "" : s)

          .replace(/\s+/g, "");
        const m = s.match(/^(\d+(?:[.,]\d+)*)(rb|ribu|k|jt|juta)?$/);
        if (!m) return null;
        let n = m[1],
          u = m[2],
          v;
        if (u) {
          if ((n.match(/[.,]/g) || []).length > 1) n = n.replace(/[.,]/g, "");
          v =
            parseFloat(n.replace(",", ".")) *

        else if (/^\d{1,3}([.,]\d{3})+$/.test(n)) v = +n.replace(/[.,]/g, "");

      // ================= SPLIT BILL =================
      const FEE = [
        ["tax", "Pajak (PB1/PPN)", "mis. 10"],
        ["svc", "Service charge", "mis. 5"],
        ["disc", "Diskon", "mis. 20"],
      ];
      const newSB = () => ({
        id: null,
        title: "",
        date: today(),
        people: [{ id: "p0", name: "Aku" }],
        pc: 1,
        payer: "p0",
        items: [],
        ic: 0,

          svc: { m: "pct", v: 0 },
          disc: { m: "pct", v: 0 },
        },
        paid: {},
        step: 1,
        mine: false,
        mcat: "Makanan",
        mineTx: null,
        ei: -1,
        busy: 0,
        dirty: 0,
        ts: 0,
        payAccounts: [], // [{type:"bank"|"qris", bank:"", no:"", name:""} ]
      });
      function loadSB(s) {
        const B = newSB(),
          num = (a) =>
            a.reduce(
              (m, x) => Math.max(m, parseInt(String(x.id).slice(1)) || 0),
              -1,
            ) + 1,
          fe = (k) => {
            const f = (s.tax && s.tax[k]) || {};
            return { m: f.m === "amt" ? "amt" : "pct", v: +f.v || 0 };
          };
        B.id = s.id;
        B.title = s.title || "";
        B.date = s.date || today();
        B.people = (s.people || []).map((p) => ({ id: p.id, name: p.name }));
        B.items = (s.items || []).map((i) => ({
          id: i.id,
          n: i.n,
          p: +i.p || 0,
          q: +i.q || 1,
          w: [...(i.w || [])],
        }));
        B.pc = num(B.people);
        B.ic = num(B.items);
        B.payer = s.payer || "p0";
        B.fee = { tax: fe("tax"), svc: fe("svc"), disc: fe("disc") };
        B.paid = { ...(s.paid || {}) };
        B.mineTx = s.mineTx || null;
        B.mine = !!s.mineTx;
        const t = B.mineTx && S.tx.find((x) => x.id === B.mineTx);
        if (t && t.cat) B.mcat = t.cat;
        B.payAccounts = (s.payAccounts || []).map((a) => ({
          type: a.type || "bank",
          bank: a.bank || "",
          no: a.no || "",
          name: a.name || "",
        }));
        B.step = 5;
        B.ts = s.ts || 0;
        return B;
      }
      function sbCalc(B) {
        const base = {};
        B.people.forEach((p) => (base[p.id] = 0));
        let sub = 0;
        B.items.forEach((it) => {
          const w = it.w.filter((id) => id in base);
          if (!w.length) return;
          const t = it.p * it.q;
          sub += t;
          w.forEach((id) => (base[id] += t / w.length));
        });
        const f = B.fee,
          pos = (x) => Math.max(0, x),
          disc =
            f.disc.m === "pct"
              ? (sub * Math.min(100, pos(f.disc.v))) / 100
              : Math.min(sub, pos(f.disc.v)),
          after = sub - disc,
          svc = f.svc.m === "pct" ? (after * pos(f.svc.v)) / 100 : pos(f.svc.v),
          tax =
            f.tax.m === "pct"
              ? ((after + svc) * pos(f.tax.v)) / 100
              : pos(f.tax.v),
          grand = Math.round(after + svc + tax),
          k = sub ? grand / sub : 0,
          share = {};
        let others = 0;
        B.people.forEach((p) => {
          if (p.id !== B.payer) {
            const x = Math.round((base[p.id] * k) / 100) * 100;
            share[p.id] = x;
            others += x;
          }
        });
        share[B.payer] = Math.max(0, grand - others);
        return {
          sub,
          disc: Math.round(disc),
          svc: Math.round(svc),
          tax: Math.round(tax),
          grand,
          share,
        };
      }
      function rSplits() {

      function sAddAcc() {
        const type =
          document.querySelector('input[name="acctype"]:checked')?.value ||

  <button class="btn k big" onclick="sSave()">💾 ${B.id ? "Simpan perubahan" : "Simpan ke riwayat"}</button>
  ${B.id ? '<button class="btn big" style="background:#fff;margin-bottom:0" onclick="sDel()">🗑 Hapus split ini</button>' : ""}
</div>`;

        return (
          summaryCard +
          perOrangCard +
          utangCard +
          accCard +
          shareCard +
          saveCard
        );
      }
      function sPaid(id) {
        const B = SB;
        B.paid[id] = !B.paid[id];
        if (!B.paid[id]) delete B.paid[id];
        if (B.id)
          FB.splitUpd(B.id, { paid: { ...B.paid } }).catch((e) =>
            toast("Gagal menyimpan: " + e.message, 1),
          );
        else B.dirty = 1;
        render();
      }
      function sSave() {
        const B = SB,
          c = sbCalc(B),
          er = feeErr();
        if (er) return toast(er, 1);
        if (!(c.grand > 0)) return toast("Total tagihan harus lebih dari 0", 1);
        if (!B.date) return toast("Tanggal wajib diisi", 1);
        const title =
            (B.title || "").trim().slice(0, 60) || "Split Bill " + fmtD(B.date),
          id = B.id || FB.newId("splits"),
          me = c.share.p0,
          d = {
            title,
            date: B.date,
            payer: B.payer,
            people: B.people.map((p) => ({ id: p.id, name: p.name })),
            items: B.items.map((i) => ({
              id: i.id,
              n: i.n,
              p: i.p,
              q: i.q,
              w: [...i.w],
            })),
            tax: {
              tax: { ...B.fee.tax },
              svc: { ...B.fee.svc },
              disc: { ...B.fee.disc },
            },
            total: c.grand,
            paid: { ...B.paid },
            mineTx: null,
            ts: B.ts || Date.now(),
            payAccounts: (B.payAccounts || []).map((a) => ({
              type: a.type,
              bank: a.bank,
              no: a.no,
              name: a.name,
            })),
          };
        let tx = null;
        if (B.mine && me > 0) {
          const old = B.mineTx && S.tx.find((x) => x.id === B.mineTx),
            tid = B.mineTx || FB.newId("tx");
          tx = {
            id: tid,
            data: {
              type: "out",
              amt: me,
              cat: B.mcat,
              note: "Split bill: " + title.slice(0, 60),
              date: B.date,
              ts: old ? old.ts || Date.now() : Date.now(),
            },
          };
          d.mineTx = tid;
        } else if (B.mineTx) tx = { id: B.mineTx, del: 1 };
        FB.splitSave(id, d, tx).catch((e) =>
          toast("Gagal menyimpan: " + e.message, 1),
        );
        B.id = id;
        B.ts = d.ts;
        B.mineTx = d.mineTx;
        B.mine = !!d.mineTx;
        B.dirty = 0;
        toast(
          navigator.onLine
            ? "✓ Split bill tersimpan"
            : "✓ Tersimpan di HP, disinkronkan saat online",
        );
        render();
      }
      function sDel() {
        const B = SB;
        if (
          !confirm(
            'Hapus split "' +
              (B.title || "ini") +
              '"?' +
              (B.mineTx
                ? "\nCatatan pengeluaran di Beranda tidak ikut terhapus."
                : "") +
              "\nTidak bisa dibatalkan.",
          )
        )
          return;
        FB.splitDel(B.id).catch((e) =>
          toast("Gagal menghapus: " + e.message, 1),
        );
        toast("✓ Split terhapus");
        SB = null;
        S.sub = "splits";
        render();
        scrollTo(0, 0);
      }

      const nb = ([k, i, l]) =>
        `<button class="${S.tab === k ? "on" : ""}" onclick="S.tab='${k}';${k === "more" ? "S.sub='menu';" : ""}render();scrollTo(0,0)"><b>${i}</b>${l}</button>`;
      const nav = () =>
        `<nav>${[
          ["home", "🏠", "Beranda"],
          ["hist", "🧾", "Riwayat"],
        ]
          .map(nb)
          .join("")}<button class="plus" onclick="openAdd()">+</button>${[
          ["chart", "📊", "Grafik"],
          ["more", "☰", "Lainnya"],
        ]
          .map(nb)
          .join("")}</nav>`;
      const loginCard = (m) =>
        `<section class="pg"><div class="card" style="margin-top:14vh"><span class="hl">Sakuku</span><p>Catat pemasukan dan pengeluaran dari HP dalam hitungan detik. Datamu tersimpan di akun Google-mu dan tidak terlihat oleh pengguna lain.</p>${m || '<button class="btn k big" onclick="signIn()">Masuk dengan Google</button>'}</div></section>`;
      function render() {
        const keep = $("#sb") ? $("#sb").value : "";
        let h;
        if (S.noCfg)
          h = loginCard(
            "<p><b>Firebase belum diatur.</b> Isi firebaseConfig di index.html.</p>",
          );
        else if (S.user === undefined)
          h = '<div class="sk" style="margin-top:20vh"></div>';
        else if (!S.user) h = loginCard();
        else
          h =
            { home: rHome, hist: rHist, chart: rChart, more: rMore }[S.tab]() +
            nav();
        $("#app").innerHTML = h;
        if (S.user) {
          if (S.tab === "hist") hl();
          if (keep && $("#sb")) {
            $("#sb").value = keep;
            pv(keep);
          }
        }
      }

      // ---- Sheet: tambah / edit / scan ----
      function openAdd() {
        F = { mode: "pick" };
        drawSheet();
      }
      function edit(id) {
        const x = S.tx.find((z) => z.id === id);
        F = { ...x, amt: String(x.amt), edit: 1, mode: "form" };
        drawSheet();
      }
      function closeSheet() {
        if (F && F.unsub) F.unsub();
        F = null;
        drawSheet();
      }
      function drawSheet() {
        const el = $("#sheet");
        if (!F) {
          el.className = "";
          el.innerHTML = "";
          return;
        }
        const st = el.firstChild ? el.firstChild.scrollTop : 0;
        el.className = "open";
        const cl = '<button class="x" onclick="closeSheet()">✕</button>';
        if (F.mode && F.mode[0] === "g") {
          el.innerHTML = gSheet();
          if (el.firstChild) el.firstChild.scrollTop = st;
          return;
        }
        if (F.mode === "busy") {
          el.innerHTML =
            '<div class="pn"><div class="sk"></div><p style="text-align:center">Membaca struk dengan AI…</p></div>';
          return;
        }
        if (F.mode === "pick") {
          const k = true;
          el.innerHTML = `<div class="pn"><div class="hd"><span class="hl">Catat</span>${cl}</div>
  ${
    k
      ? `<label class="btn k big">📷 Scan Struk (Kamera)<input type="file" accept="image/*" capture="environment" hidden onchange="scanFile(this)"></label>
  <label class="btn big">🖼️ Scan dari Galeri<input type="file" accept="image/*" hidden onchange="scanFile(this)"></label>`
      : `<button class="btn k big" onclick="toast('Isi API key Gemini dulu di Lainnya › Pengaturan',1,4000)">📷 Scan Struk</button>`
  }
  <button class="btn big" style="background:#fff" onclick="F.type='out';F.amt='';F.cat='';F.date=today();F.note='';F.mode='form';drawSheet()">✍️ Input Manual</button></div>`;
          return;
        }
        if (!F.cat) F.cat = "Lainnya";
        F.cs = [...new Set([...CATS[F.type], F.cat])];
        el.innerHTML = `<div class="pn"><div class="hd"><span class="hl">${F.edit ? "Edit" : "Tambah"} Transaksi</span>${cl}</div>
  ${F.scanned ? '<div class="card g" style="padding:10px;margin:12px 0 4px">🔍 Hasil scan. Periksa dulu sebelum menyimpan.</div>' : ""}
  <div class="row">${[
    ["out", "Pengeluaran"],
    ["in", "Pemasukan"],
  ]
    .map(
      ([k, l]) =>
        `<button class="chip ${F.type === k ? "on" : ""}" ${F.edit ? "disabled" : ""} onclick="F.type='${k}';F.cat='';drawSheet()">${l}</button>`,
    )
    .join("")}</div>
  <div class="amt" id="amtv">${rp(+F.amt || 0)}</div>
  <div class="row">${[10000, 50000, 100000].map((v) => `<button class="chip" onclick="addA(${v})">+${v / 1000}rb</button>`).join("")}<button class="chip" onclick="F.amt='';addA(0)">Reset</button></div>
  <div class="pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9, "000", 0, "⌫"].map((k) => `<button onclick="np('${k}')">${k}</button>`).join("")}</div>
  <div class="row wrap">${F.cs.map((c, k) => `<button class="chip ${F.cat === c ? "on" : ""}" onclick="F.cat=F.cs[${k}];drawSheet()">${esc(c)}</button>`).join("")}</div>
  <input type="date" value="${F.date}" oninput="F.date=this.value"><input placeholder="Catatan (opsional)" value="${esc(F.note || "")}" oninput="F.note=this.value">
  <button class="btn k big" onclick="submitF()">Simpan</button>
  ${F.edit ? '<button class="btn big" style="background:#fff" onclick="delF()">🗑 Hapus transaksi</button>' : ""}</div>`;
        el.firstChild.scrollTop = st;
      }
      function addA(v) {
        F.amt = String((+F.amt || 0) + v || "");
        $("#amtv").textContent = rp(+F.amt || 0);
      }
      function np(k) {
        F.amt =
          k === "⌫"
            ? F.amt.slice(0, -1)
            : (F.amt + k).replace(/^0+/, "").slice(0, 12);
        $("#amtv").textContent = rp(+F.amt || 0);
      }
      function submitF() {
        if (
          save({
            id: F.id,
            ts: F.ts,
            type: F.type,
            amt: +F.amt,
            cat: F.cat,
            note: (F.note || "").trim(),
            date: F.date,
          })
        )
          closeSheet();
      }
      function delF() {
        if (!confirm("Hapus transaksi ini? Tidak bisa dibatalkan.")) return;
        FB.del(F.id).catch((e) => toast("Gagal menghapus: " + e.message, 1));
        toast("✓ Terhapus");
        closeSheet();
      }
      function shrink(f) {
        return new Promise((ok, no) => {
          const i = new Image();
          i.onload = () => {
            const k = Math.min(1, 1400 / Math.max(i.width, i.height)),
              c = document.createElement("canvas");
            c.width = i.width * k;
            c.height = i.height * k;
            c.getContext("2d").drawImage(i, 0, 0, c.width, c.height);
            ok(c.toDataURL("image/jpeg", 0.8).split(",")[1]);
          };
          i.onerror = () => no(Error("Gambar tidak terbaca"));
          i.src = URL.createObjectURL(f);
        });
      }
      async function scanApi(img, custom) {
        const prompt =
          custom ||
          'Baca struk belanja ini. Balas HANYA JSON: {"total": angka rupiah tanpa titik (total akhir yang dibayar), "date": "YYYY-MM-DD" atau null, "merchant": "nama toko", "category": salah satu dari [' +
            CATS.out.filter((c) => c !== "Tabungan").join(", ") +
            "]}";
        const r = await fetch(
          "https://generativelanguage.googleapis.com/v1beta/models/" +
            MODEL +
            ":generateContent",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "x-goog-api-key": window.GEMINI_KEY,
            },
            body: JSON.stringify({
              contents: [
                {
                  parts: [
                    { text: prompt },
                    { inline_data: { mime_type: "image/jpeg", data: img } },
                  ],
                },
              ],
              generationConfig: {
                responseMimeType: "application/json",
                temperature: 0,
              },
            }),
          },
        );
        if (!r.ok)
          throw Error(
            "Gemini " +
              r.status +
              (r.status === 400 || r.status === 403 ? " (cek API key)" : ""),
          );
        const j = await r.json();
        return JSON.parse(
          j.candidates[0].content.parts[0].text.replace(/```json|```/g, ""),
        );
      }
      async function scanFile(inp) {
        const f = inp.files[0];
        if (!f) return;
        F = { mode: "busy" };
        drawSheet();
        try {
          const r = await scanApi(await shrink(f));
          if (!F) return;
          F = {
            type: "out",
            amt: String(Math.round(+r.total || 0)),
            cat: CATS.out.includes(r.category) ? r.category : "Lainnya",
            date: /^\d{4}-\d\d-\d\d$/.test(r.date || "") ? r.date : today(),
            note: r.merchant || "",
            mode: "form",
            scanned: 1,
          };
        } catch (e) {
          toast("Scan gagal: " + e.message, 1);
          F = { mode: "pick" };
        }
        drawSheet();
      }
      $("#sheet").addEventListener("click", (e) => {
        if (e.target.id === "sheet") closeSheet();
      });
      if ("serviceWorker" in navigator)
        navigator.serviceWorker.register("sw.js");
      render();
    </script>

    <script type="module">
      // ===== ISI DENGAN firebaseConfig MILIKMU (Firebase Console > Project settings > Your apps) =====
      const firebaseConfig = {
        apiKey: "AIzaSyAp2RxYRf35SsSJRRNmdGkNrYffwbmoUxc",
        authDomain: "sakuku-c8b58.firebaseapp.com",
        projectId: "sakuku-c8b58",
        storageBucket: "sakuku-c8b58.firebasestorage.app",
        messagingSenderId: "682514211151",
        appId: "1:682514211151:web:a3c724f26fea970cf8253a",
      };
      // ===============================================================================================
      if (firebaseConfig.apiKey.startsWith("ISI")) {
        onNoConfig();
      } else {
        const V = "10.14.1",
          B = "https://www.gstatic.com/firebasejs/" + V + "/";
        const { initializeApp } = await import(B + "firebase-app.js");
        const {
          getAuth,
          GoogleAuthProvider,
          signInWithPopup,
          signInWithRedirect,
          onAuthStateChanged,
          signOut,
        } = await import(B + "firebase-auth.js");
        const {
          initializeFirestore,
          persistentLocalCache,
          persistentMultipleTabManager,
          collection,
          doc,
          setDoc,
          addDoc,
          deleteDoc,
          onSnapshot,
          updateDoc,
          writeBatch,
          increment,
          getDocs,
        } = await import(B + "firebase-firestore.js");
        const app = initializeApp(firebaseConfig),
          auth = getAuth(app);
        const db = initializeFirestore(app, {
          localCache: persistentLocalCache({
            tabManager: persistentMultipleTabManager(),
          }),
        });
        let uid = null,
          subs = [];
        const col = () => collection(db, "users", uid, "tx");
        window.FB = {
          async signIn() {
            const p = new GoogleAuthProvider();
            try {
              await signInWithPopup(auth, p);
            } catch (e) {
              if (
                e.code === "auth/popup-blocked" ||
                e.code === "auth/operation-not-supported-in-this-environment"
              )
                await signInWithRedirect(auth, p);
              else if (
                e.code !== "auth/popup-closed-by-user" &&
                e.code !== "auth/cancelled-popup-request"
              )
                throw e;
            }
          },
          out: () => signOut(auth),
          add: (d) => addDoc(col(), d),
          set: (id, d) => setDoc(doc(db, "users", uid, "tx", id), d),
          del: (id) => deleteDoc(doc(db, "users", uid, "tx", id)),
          prefs: (p) =>
            setDoc(doc(db, "users", uid, "meta", "prefs"), { presets: p }),
          newId: (c) => doc(collection(db, "users", uid, c)).id,
          goalNew: (d) => setDoc(doc(collection(db, "users", uid, "goals")), d),
          goalUpd: (id, d) => updateDoc(doc(db, "users", uid, "goals", id), d),
          goalMove(gid, amt, type, date, tx, upd, r) {
            const b = writeBatch(db),
              gr = doc(db, "users", uid, "goals", gid),
              lg = { amt, type, date, ts: Date.now() };
            if (r) lg.r = true;
            b.update(gr, {
              saved: increment(type === "in" ? amt : -amt),
              ...upd,
            });
            b.set(doc(collection(gr, "log")), lg);
            if (tx) b.set(doc(collection(db, "users", uid, "tx")), tx);
            return b.commit();
          },
          goalLog: (id, cb, er) =>
            onSnapshot(
              collection(db, "users", uid, "goals", id, "log"),
              (s) => cb(s.docs.map((d) => ({ id: d.id, ...d.data() }))),
              er,
            ),
          goalDel(id) {
            const gr = doc(db, "users", uid, "goals", id),
              p = deleteDoc(gr);
            getDocs(collection(gr, "log"))
              .then(async (s) => {
                for (let i = 0; i < s.docs.length; i += 400) {
                  const b = writeBatch(db);
                  s.docs.slice(i, i + 400).forEach((d) => b.delete(d.ref));
                  await b.commit();
                }
              })
              .catch(() => {});
            return p;
          },
          splitSave(id, d, tx) {
            const b = writeBatch(db);
            b.set(doc(db, "users", uid, "splits", id), d);
            if (tx && tx.del) b.delete(doc(db, "users", uid, "tx", tx.id));
            else if (tx) b.set(doc(db, "users", uid, "tx", tx.id), tx.data);
            return b.commit();
          },
          splitUpd: (id, d) =>
            updateDoc(doc(db, "users", uid, "splits", id), d),
          splitDel: (id) => deleteDoc(doc(db, "users", uid, "splits", id)),
        };
        onAuthStateChanged(auth, (u) => {
          subs.forEach((f) => f());
          subs = [];
          if (!u) {
            uid = null;
            onUser(null);
            return;
          }
          uid = u.uid;
          onUser(u);
          subs.push(
            onSnapshot(
              col(),
              (s) => onTx(s.docs.map((d) => ({ id: d.id, ...d.data() }))),
              onErr,
            ),
          );
          subs.push(
            onSnapshot(
              doc(db, "users", uid, "meta", "prefs"),
              (s) => {
                if (s.exists()) onPrefs(s.data().presets);
              },
              () => {},
            ),
          );
          subs.push(
            onSnapshot(
              collection(db, "users", uid, "goals"),
              (s) => onGoals(s.docs.map((d) => ({ id: d.id, ...d.data() }))),
              onGErr,
            ),
          );
          subs.push(
            onSnapshot(
              collection(db, "users", uid, "splits"),
              (s) => onSplits(s.docs.map((d) => ({ id: d.id, ...d.data() }))),
              onSErr,
            ),
          );
        });
      }
    </script>
